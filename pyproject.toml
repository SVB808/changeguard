[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "changeguard"
version = "1.0.0"
description = "Cross-service change impact and release risk analysis for Java/Spring systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.10,<2.0",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
ai = [
  "openai>=2.54,<4.0",
]

[project.scripts]
changeguard = "changeguard.cli:app"
changeguard-runtime = "changeguard.runtime_cli:runtime_app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
